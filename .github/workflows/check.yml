name: Validate kitchen and assistant
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            companion/package-lock.json
      - run: npm ci
      - run: npm ci --prefix companion
      # Check before building, so regenerated files cannot hide contract drift.
      - run: node scripts/build-contract.mjs --check
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: npm run check --prefix companion
      - run: npm test --prefix companion
